<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Juan Admin - Customers</title>
    <link rel="shortcut icon" href="assets/img/logo.png" type="image/png" />
    <link rel="stylesheet" href="assets/css/admin.css" />
  </head>
  <body data-page="customers">
    <div class="admin-shell">
      <aside class="sidebar">
        <a class="brand" href="index.html" data-transition>
          <img src="assets/img/logo.png" alt="Juan" />
          <span>Admin</span>
        </a>
        <nav class="side-nav" aria-label="Admin navigation">
          <a href="index.html" data-transition>Dashboard</a>
          <a href="products.html" data-transition>Products</a>
          <a href="orders.html" data-transition>Orders</a>
          <a class="active" href="customers.html" data-transition>Customers</a>
          <a href="analytics.html" data-transition>Analytics</a>
          <a href="settings.html" data-transition>Settings</a>
        </nav>
        <div class="sidebar-card">
          <span>Audience</span>
          <strong>3,480 Users</strong>
          <p>146 new customers joined this month.</p>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <button class="menu-button" type="button" aria-label="Toggle menu" data-menu-toggle>
            <span></span>
            <span></span>
            <span></span>
          </button>
          <div>
            <p class="eyebrow">People</p>
            <h1>Customers</h1>
          </div>
          <div class="topbar-actions">
            <a class="ghost-button" href="orders.html" data-transition>Orders</a>
            <button class="primary-button" type="button" data-pulse>New Segment</button>
          </div>
        </header>

        <section class="content-grid">
          <article class="panel reveal">
            <div class="panel-head">
              <div>
                <p class="eyebrow">Segments</p>
                <h3>Customer Groups</h3>
              </div>
            </div>
            <div class="segment-list">
              <button type="button" data-pulse>
                <span>VIP Buyers</span>
                <strong>420</strong>
              </button>
              <button type="button" data-pulse>
                <span>New Accounts</span>
                <strong>146</strong>
              </button>
              <button type="button" data-pulse>
                <span>Repeat Buyers</span>
                <strong>1,210</strong>
              </button>
            </div>
          </article>

          <article class="panel reveal">
            <div class="panel-head">
              <div>
                <p class="eyebrow">Profiles</p>
                <h3>Top Customers</h3>
              </div>
              <button class="filter-button" type="button" data-pulse>Filter</button>
            </div>
            <div class="customer-list">
              <div>
                <span class="avatar">EW</span>
                <strong>Emma Wilson</strong>
                <em>$1,284 spent</em>
              </div>
              <div>
                <span class="avatar">LC</span>
                <strong>Liam Carter</strong>
                <em>$980 spent</em>
              </div>
              <div>
                <span class="avatar">OR</span>
                <strong>Olivia Reed</strong>
                <em>$842 spent</em>
              </div>
            </div>
          </article>
        </section>
      </main>
    </div>
    <script src="assets/js/admin.js"></script>
  </body>
</html>
