<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Juan Admin - Settings</title>
    <link rel="shortcut icon" href="assets/img/logo.png" type="image/png" />
    <link rel="stylesheet" href="assets/css/admin.css" />
  </head>
  <body data-page="settings">
    <div class="admin-shell">
      <aside class="sidebar">
        <a class="brand" href="index.html" data-transition>
          <img src="assets/img/logo.png" alt="Juan" />
          <span>Admin</span>
        </a>
        <nav class="side-nav" aria-label="Admin navigation">
          <a href="index.html" data-transition>Dashboard</a>
          <a href="products.html" data-transition>Products</a>
          <a href="orders.html" data-transition>Orders</a>
          <a href="customers.html" data-transition>Customers</a>
          <a href="analytics.html" data-transition>Analytics</a>
          <a class="active" href="settings.html" data-transition>Settings</a>
        </nav>
        <div class="sidebar-card">
          <span>Admin Area</span>
          <strong>Configured</strong>
          <p>Store preferences are ready for review.</p>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <button class="menu-button" type="button" aria-label="Toggle menu" data-menu-toggle>
            <span></span>
            <span></span>
            <span></span>
          </button>
          <div>
            <p class="eyebrow">Control</p>
            <h1>Settings</h1>
          </div>
          <div class="topbar-actions">
            <a class="ghost-button" href="index.html" data-transition>Dashboard</a>
            <button class="primary-button" type="button" data-pulse>Save Changes</button>
          </div>
        </header>

        <section class="content-grid wide-left">
          <article class="panel reveal">
            <div class="panel-head">
              <div>
                <p class="eyebrow">Store</p>
                <h3>General Settings</h3>
              </div>
            </div>
            <form class="admin-form two-column">
              <label>
                Store Name
                <input type="text" value="Juan Online Store" />
              </label>
              <label>
                Currency
                <select>
                  <option>USD</option>
                  <option>EUR</option>
                  <option>GBP</option>
                </select>
              </label>
              <label>
                Support Email
                <input type="email" value="support@juanstore.com" />
              </label>
              <label>
                Default Status
                <select>
                  <option>Published</option>
                  <option>Draft</option>
                </select>
              </label>
            </form>
          </article>

          <article class="panel reveal">
            <div class="panel-head">
              <div>
                <p class="eyebrow">Preferences</p>
                <h3>Admin Tools</h3>
              </div>
            </div>
            <div class="toggle-list">
              <label>
                <span>Order Alerts</span>
                <input type="checkbox" checked />
              </label>
              <label>
                <span>Low Stock Notices</span>
                <input type="checkbox" checked />
              </label>
              <label>
                <span>Weekly Reports</span>
                <input type="checkbox" />
              </label>
            </div>
          </article>
        </section>
      </main>
    </div>
    <script src="assets/js/admin.js"></script>
  </body>
</html>
